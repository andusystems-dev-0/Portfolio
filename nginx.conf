server {
    # nginxinc/nginx-unprivileged runs as non-root user `nginx` (uid 101) and
    # cannot bind to ports < 1024. 8080 is the default for that image.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP is split between header and SvelteKit-emitted <meta> tag.
    # Header carries directives that CANNOT be set via meta (frame-ancestors,
    # report-uri/report-to). SvelteKit emits a meta CSP at build time with
    # per-build sha256 hashes for its hydration <script> tag, allowing only
    # those specific inline scripts to run. See svelte.config.js -> kit.csp
    # for the full per-resource policy. The two are AND-ed by browsers.
    #
    # IMPORTANT: this header MUST NOT include default-src or script-src — if
    # it did, the meta tag's hash-based script-src would be intersected with
    # the header's stricter directive and inline scripts would be blocked
    # again, regressing to the bug this configuration exists to fix.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_static on;
}
